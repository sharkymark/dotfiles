"$schema" = "https://starship.rs/config-schema.json"

command_timeout = 5000
add_newline = false

# Path + branch left; clock right.
format = "$directory$git_branch$character"
right_format = "$time"

[directory]
format = "[$path]($style) "
style = "bold blue"
truncate_to_repo = true
truncation_length = 3
read_only = " "
read_only_style = "bold red"

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%a %b %d %T %:z"
style = "bold cyan"

[aws]
disabled = true
[gcloud]
disabled = true
[kubernetes]
disabled = true
[golang]
disabled = true
[git_branch]
disabled = false
format = "on [$symbol$branch(:$remote_branch)]($style) "
style = "bold purple"

[git_commit]
disabled = true
[git_status]
disabled = true
[git_state]
disabled = true
[git_metrics]
disabled = true
