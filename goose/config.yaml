GOOSE_MODE: smart_approve
extensions:
  developer:
    enabled: true
    type: builtin
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    timeout: null
    bundled: true
  nuon-local:
    bundled: null
    description: Nuon local MCP server for Google Drive notes
    enabled: true
    env_keys: []
    envs: {}
    headers: {}
    name: nuon-local
    timeout: 300
    type: streamable_http
    uri: http://127.0.0.1:8000/mcp
  grain:
    bundled: null
    description: Grain MCP server
    enabled: true
    env_keys: []
    envs: {}
    headers: {}
    name: grain
    timeout: 300
    type: streamable_http
    uri: https://api.grain.com/_/mcp
  superhuman-mail:
    bundled: null
    description: Superhuman Mail MCP server
    enabled: true
    env_keys: []
    envs: {}
    headers: {}
    name: superhuman-mail
    timeout: 300
    type: streamable_http
    uri: https://mcp.mail.superhuman.com/mcp
  linear:
    bundled: null
    description: Linear MCP server
    enabled: true
    env_keys: []
    envs: {}
    headers: {}
    name: linear
    timeout: 300
    type: streamable_http
    uri: https://mcp.linear.app/mcp
  airtable:
    bundled: null
    description: Airtable MCP server
    enabled: false
    env_keys: []
    envs: {}
    headers: {}
    name: airtable
    timeout: 300
    type: streamable_http
    uri: https://mcp.airtable.com/mcp
  salesforce-dx:
    args:
    - -y
    - "@salesforce/mcp@latest"
    - --orgs
    - DEFAULT_TARGET_ORG
    - --toolsets
    - orgs,data,users
    - --no-telemetry
    bundled: null
    cmd: npx
    description: Salesforce DX MCP server (orgs, data, users toolsets)
    enabled: false
    env_keys: []
    envs: {}
    name: salesforce-dx
    timeout: 300
    type: stdio
  nuonco-slack-personal-token:
    args:
    - -c
    - 'SLACK_MCP_XOXC_TOKEN="$SLACK_MCP_XOXC_TOKEN_NUONCO" SLACK_MCP_XOXD_TOKEN="$SLACK_MCP_XOXD_TOKEN_NUONCO" exec npx -y slack-mcp-server@latest --transport stdio'
    bundled: null
    cmd: sh
    description: Slack MCP server for the nuonco workspace (personal token)
    enabled: true
    env_keys: []
    envs: {}
    name: nuonco-slack-personal-token
    timeout: 300
    type: stdio
  nuon-byoc-slack-personal-token:
    args:
    - -c
    - 'SLACK_MCP_XOXC_TOKEN="$SLACK_MCP_XOXC_TOKEN_NUON_BYOC" SLACK_MCP_XOXD_TOKEN="$SLACK_MCP_XOXD_TOKEN_NUON_BYOC" exec npx -y slack-mcp-server@latest --transport stdio'
    bundled: null
    cmd: sh
    description: Slack MCP server for the nuon-byoc workspace (personal token)
    enabled: true
    env_keys: []
    envs: {}
    name: nuon-byoc-slack-personal-token
    timeout: 300
    type: stdio
  plausible-analytics:
    args:
    - -c
    - 'PLAUSIBLE_API_KEY="$PLAUSIBLE_API_KEY" exec npx -y plausible-mcp'
    bundled: null
    cmd: sh
    description: Plausible Analytics MCP server
    enabled: false
    env_keys: []
    envs: {}
    name: plausible-analytics
    timeout: 300
    type: stdio
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  tom:
    enabled: true
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  scheduler:
    enabled: true
    type: platform
    name: scheduler
    description: Create and manage scheduled recipe execution
    display_name: Scheduler
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
GOOSE_TELEMETRY_ENABLED: false
